<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Змейка — браузерная игра</title>
  <style>
    :root{--ink:#182019;--paper:#fffdf7;--green:#33734b;--orange:#e65d38}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"Trebuchet MS",Arial,sans-serif;min-height:100vh;background:radial-gradient(circle at 15% 5%,#ffffffbf,transparent 28rem),linear-gradient(145deg,#edf3df,#bdd7b5)}
    button{font:inherit}main{min-height:100vh;display:grid;place-items:center;padding:28px 16px}.shell{width:min(100%,560px);background:var(--paper);border:1px solid #18201926;border-radius:28px;padding:26px 28px 20px;box-shadow:0 22px 65px #27482c33}
    header,.scores,.controls,footer{display:flex;align-items:center}header{justify-content:space-between;margin-bottom:18px}.eyebrow{color:var(--green);font-size:11px;letter-spacing:.18em;font-weight:800;margin:0 0 2px}h1{font-family:Georgia,serif;font-size:clamp(40px,8vw,58px);line-height:.95;margin:0;letter-spacing:-.05em}.mark{width:44px;height:44px;border-radius:50%;border:1px solid #d7d5c9;background:#f7f2e6;display:grid;place-items:center}.mark:after{content:"";width:13px;height:13px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px #d9e8d2}
    .scores{gap:10px;margin-bottom:12px}.card{flex:1;border:1px solid #ddd8ca;border-radius:15px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;background:#faf7ed}.card span{font-size:11px;font-weight:800;letter-spacing:.12em;color:#73766f}.card strong{font:25px Georgia,serif}.card.best strong{color:var(--orange)}
    .frame{background:#255b3b;padding:8px;border-radius:18px;box-shadow:0 7px 0 #173e29}.board{position:relative;aspect-ratio:1;display:grid;grid-template-columns:repeat(20,1fr);border-radius:12px;overflow:hidden;background-color:#dfeccf;background-image:linear-gradient(#34734b14 1px,transparent 1px),linear-gradient(90deg,#34734b14 1px,transparent 1px);background-size:5% 5%}.cell{position:relative}.snake:after,.food:after{content:"";position:absolute;inset:8%}.snake:after{background:var(--green);border-radius:24%;box-shadow:inset 0 -2px #00000026}.head:after{inset:-45%;z-index:2;background:url("snake-head.png") center 42%/cover no-repeat;border:2px solid #fff8e9;border-radius:50%;box-shadow:0 2px 5px #0f2d196b}.food:after{inset:-12% 7%;background:linear-gradient(90deg,#ffffff59,transparent 25% 75%,#5c070c40),#8b1925;border:1px solid #531018;border-radius:20% 20% 14% 14%;box-shadow:inset 0 2px #d8c8ad,inset 0 -2px #c6b79c,0 2px 4px #3d201440}.food:before{content:"DP";position:absolute;z-index:2;inset:3%;display:grid;place-items:center;color:#fff8e9;font:800 clamp(5px,1.3vw,9px) Georgia,serif;transform:rotate(-8deg)}
    .over{position:absolute;inset:0;z-index:3;background:#1b3321de;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(3px)}.over.show{display:flex}.over span{font-size:12px;letter-spacing:.16em;font-weight:800}.over strong{font:70px Georgia,serif;margin:5px 0 18px}.over button,.pause{border:0;border-radius:999px;background:var(--orange);color:#fff;font-weight:800;padding:12px 22px;cursor:pointer;box-shadow:0 4px #a63c24}.over small{margin-top:11px;opacity:.7}
    .status{text-align:center;color:#6e756d;font-size:13px;font-weight:700;margin:19px 0 15px}.status:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#a7aaa4;margin-right:7px}.status.live:before{background:#4eaa67;box-shadow:0 0 0 4px #e0f0df}.controls{justify-content:center;gap:32px}.dpad{display:grid;grid-template:repeat(2,43px)/repeat(3,43px);gap:5px}.dpad button{border:1px solid #d5d5cc;border-bottom-width:3px;border-radius:11px;background:#f4f1e8;color:var(--green);font-size:22px;font-weight:800;cursor:pointer}.up{grid-column:2}.left{grid-row:2;grid-column:1}.down{grid-row:2;grid-column:2}.right{grid-row:2;grid-column:3}.pause{background:var(--green);box-shadow:0 4px #1d4b30;min-width:135px}.pause:disabled{opacity:.45}
    footer{justify-content:space-between;gap:14px;border-top:1px solid #e2ded3;margin-top:22px;padding-top:15px;color:#777a75;font-size:10px;font-weight:700}kbd{padding:3px 5px;border:1px solid #d1d0c9;border-bottom-width:2px;border-radius:5px;background:#f2f0e9;margin-right:2px;font:700 9px Arial}
    @media(max-width:540px){main{padding:0}.shell{min-height:100vh;border-radius:0;padding:22px 16px}.controls{gap:22px}footer{flex-direction:column}}
  </style>
</head>
<body><main><section class="shell"><header><div><p class="eyebrow">КЛАССИЧЕСКАЯ ИГРА</p><h1>Змейка</h1></div><div class="mark"></div></header>
  <div class="scores"><div class="card"><span>СЧЁТ</span><strong id="score">00</strong></div><div class="card best"><span>РЕКОРД</span><strong id="best">00</strong></div></div>
  <div class="frame"><div class="board" id="board"><div class="over" id="over"><span>ТВОЙ СЧЁТ</span><strong id="final">0</strong><button id="again">Играть снова</button><small>или нажми Enter</small></div></div></div>
  <div class="status" id="status">Нажми стрелку, чтобы начать</div>
  <div class="controls"><div class="dpad"><button class="up" data-d="up">↑</button><button class="left" data-d="left">←</button><button class="down" data-d="down">↓</button><button class="right" data-d="right">→</button></div><button class="pause" id="pause" disabled>Ⅱ Пауза</button></div>
  <footer><span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> или WASD — движение</span><span><kbd>ПРОБЕЛ</kbd> — пауза</span></footer>
  </section></main>
  <script>
    const N=20,M={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]},O={up:"down",down:"up",left:"right",right:"left"};
    const board=document.querySelector("#board"),scoreEl=document.querySelector("#score"),bestEl=document.querySelector("#best"),statusEl=document.querySelector("#status"),pause=document.querySelector("#pause"),over=document.querySelector("#over"),final=document.querySelector("#final");
    let snake,food,dir,nextDir,state,score,timer,best=+(localStorage["snake-best"]||0);bestEl.textContent=String(best).padStart(2,"0");
    const cells=Array.from({length:N*N},()=>{const e=document.createElement("span");e.className="cell";board.insertBefore(e,over);return e});
    function reset(start=true){snake=[[10,10],[9,10],[8,10]];food=[14,10];dir=nextDir="right";score=0;state=start?"playing":"ready";over.classList.remove("show");draw();run()}
    function freeFood(){const f=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!snake.some(p=>p[0]===x&&p[1]===y))f.push([x,y]);return f[Math.floor(Math.random()*f.length)]}
    function steer(d){if(O[dir]===d)return;nextDir=d;if(state==="ready"){state="playing";run()}draw()}
    function draw(){cells.forEach(c=>c.className="cell");snake.forEach((p,i)=>cells[p[1]*N+p[0]].className="cell snake"+(i===0?" head":""));cells[food[1]*N+food[0]].className="cell food";scoreEl.textContent=String(score).padStart(2,"0");bestEl.textContent=String(best).padStart(2,"0");pause.disabled=state==="ready";pause.textContent=state==="paused"?"▶ Продолжить":"Ⅱ Пауза";statusEl.className="status"+(state==="playing"?" live":"");statusEl.textContent=state==="ready"?"Нажми стрелку, чтобы начать":state==="paused"?"Пауза":state==="over"?"Игра окончена":"Собирай банки и не врезайся"}
    function run(){clearInterval(timer);if(state!=="playing")return;timer=setInterval(step,Math.max(75,155-score*3))}
    function step(){dir=nextDir;const [dx,dy]=M[dir],h=[snake[0][0]+dx,snake[0][1]+dy],ate=h[0]===food[0]&&h[1]===food[1],body=ate?snake:snake.slice(0,-1);if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||body.some(p=>p[0]===h[0]&&p[1]===h[1])){state="over";clearInterval(timer);best=Math.max(best,score);localStorage["snake-best"]=best;final.textContent=score;over.classList.add("show");draw();return}snake.unshift(h);if(ate){score++;food=freeFood();run()}else snake.pop();draw()}
    document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>steer(b.dataset.d));pause.onclick=()=>{state=state==="playing"?"paused":"playing";state==="playing"?run():clearInterval(timer);draw()};document.querySelector("#again").onclick=()=>reset();
    addEventListener("keydown",e=>{const d={ArrowUp:"up",w:"up",W:"up",ArrowDown:"down",s:"down",S:"down",ArrowLeft:"left",a:"left",A:"left",ArrowRight:"right",d:"right",D:"right"}[e.key];if(d){e.preventDefault();steer(d)}else if(e.code==="Space"){e.preventDefault();pause.click()}else if(e.key==="Enter"&&state==="over")reset()});reset(false);
  </script>
</body></html>
